<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Convert | Conversor de Moedas para Reais</title>
    <meta
      name="description"
      content="Converta valores de dólar americano, euro e libra esterlina para reais de forma simples e rápida."
    />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" href="./img/logo.svg" type="image/svg+xml" />

    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <img src="./img/logo.svg" alt="Convert — Conversor de moedas" />

    <main>
      <form aria-label="Conversor de moedas para reais">
        <label for="amount">Valor</label>
        <input
          type="text"
          name="amount"
          id="amount"
          placeholder="0"
          inputmode="numeric"
          autocomplete="off"
          required
        />

        <label for="currency">Moeda</label>
        <select name="currency" id="currency" required>
          <option value="" disabled selected hidden>Selecione a moeda</option>
          <option value="USD">Dólar Americano</option>
          <option value="EUR">Euro</option>
          <option value="GBP">Libra Esterlina</option>
        </select>

        <button type="submit">Converter em reais</button>
      </form>

      <footer aria-label="Resultado da conversão">
        <span id="description">US$ 1 = R$ 4,86</span>
        <h1 id="result">486,00 Reais</h1>
      </footer>
    </main>

    <script src="scripts.js"></script>
  </body>
</html>
